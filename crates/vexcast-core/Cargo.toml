[package]
name = "vexcast-core"
description = "Vexcast core: libobs engine, multistream, chat, alerts and local AI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "multipart"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tower = { version = "0.5", features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "http2", "charset"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
rust-embed = { version = "8", features = ["mime-guess", "include-exclude"] }
jpeg-encoder = { version = "0.6", optional = true }
parking_lot = "0.12"
local-ip-address = "0.6"
semver = "1"
bytes = "1"
async-stream = { version = "0.3", optional = true }
url = "2"
base64 = "0.22"
hound = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk"], optional = true }
libobs = { version = "=6.0.0", optional = true }

[features]
default = ["obs"]
# The libobs engine. Needs the OBS runtime (see docs/DEVELOPMENT.md). Without it the
# core still runs (API, chat, AI) but reports the video engine as unavailable.
obs = ["dep:libobs", "dep:jpeg-encoder", "dep:async-stream", "dep:sysinfo"]

[package.metadata]
libobs-version = "32.1.2"
