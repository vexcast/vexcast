[package]
name = "vexcast-desktop"
description = "Vexcast desktop app (Tauri shell around the Vexcast core)"
version = "1.2.1"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/vexcast/vexcast"
authors = ["Vexcast contributors"]
default-run = "vexcast-desktop"

[lib]
name = "vexcast_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
vexcast-core = { path = "../../../crates/vexcast-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
anyhow = "1"
tokio = { version = "1", features = ["time"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
