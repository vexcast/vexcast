<!doctype html>
<!-- Vexcast donation goal widget. SPDX-License-Identifier: GPL-3.0-or-later -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Vexcast · Meta</title>
<link rel="stylesheet" href="shared/widget.css">
<style>
  :root {
    /* Scales with the source size, capped for full-HD canvases */
    --u: min(2.3vw, 9vh, 22px);
    --accent: #7c5cff;
    --accent-2: #22d3ee;
    --gold-1: #ffe066;
    --gold-2: #ffb020;
    --text: #fff;
    --font: inherit;
    --pa: 0.75;
    --bar-h: 2.1em;
    --bar-r: 999px;
  }
  html, body { background: transparent; }
  #root { font-family: var(--font); }

  #root {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(var(--u) * 0.8);
    font-size: var(--u);
  }
  #root.top { align-items: flex-start; }
  #root.bottom { align-items: flex-end; }

  .goal {
    position: relative;
    width: min(100%, 52em);
    padding: 0.95em 1.15em 1.05em;
    border-radius: 1.1em;
    background: linear-gradient(135deg, rgba(28, 26, 44, var(--pa)), rgba(12, 12, 22, calc(var(--pa) * 0.92)));
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 0.6em 2em rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }
  #root { animation: appear 0.7s var(--vx-ease-out) both; }
  .goal.reached .head, .goal.reached .bar { animation: celebrate 0.9s var(--vx-ease-spring); }
  .head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 1em;
    margin-bottom: 0.65em;
  }
  .title {
    display: flex;
    align-items: center;
    gap: 0.5em;
    min-width: 0;
    font-size: 1.15em;
    font-weight: 800;
    letter-spacing: -0.005em;
    text-shadow: var(--vx-outline);
  }
  .title span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trophy {
    flex: none;
    width: 1.55em;
    height: 1.55em;
    display: grid;
    place-items: center;
    border-radius: 0.45em;
    background: linear-gradient(145deg, var(--accent), var(--accent-2));
    box-shadow: 0 0.2em 0.7em rgba(0, 0, 0, 0.35);
  }
  .trophy svg { width: 64%; height: 64%; fill: #fff; }
  .nums {
    flex: none;
    font-size: 1.05em;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.72);
    font-variant-numeric: tabular-nums;
    text-shadow: var(--vx-outline);
    white-space: nowrap;
  }
  .nums b { color: #fff; font-weight: 850; font-size: 1.22em; }

  .bar {
    position: relative;
    height: var(--bar-h);
    border-radius: var(--bar-r);
    background: rgba(255, 255, 255, 0.09);
    box-shadow: inset 0 0.12em 0.35em rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.06);
    overflow: hidden;
  }
  .fill {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 0;
    min-width: var(--bar-h);
    border-radius: var(--bar-r);
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 1.2em rgba(124, 92, 255, 0.45), inset 0 0.15em 0 rgba(255, 255, 255, 0.28), inset 0 -0.2em 0.4em rgba(0, 0, 0, 0.18);
    transition: width 1.2s var(--vx-ease-out), background 0.6s ease;
    overflow: hidden;
  }
  .fill.empty { min-width: 0; }
  .fill::before {
    /* moving diagonal stripes */
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(115deg, rgba(255, 255, 255, 0.11) 0 0.7em, rgba(255, 255, 255, 0) 0.7em 1.4em);
    background-size: 3.3em 100%;
    animation: stripes 1.4s linear infinite;
  }
  .fill::after {
    /* shimmer sweep */
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    width: 40%;
    background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0));
    transform: translateX(-120%) skewX(-20deg);
    animation: shimmer 2.6s ease-in-out infinite;
  }
  .pct {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 850;
    font-size: 0.95em;
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
    text-shadow: var(--vx-outline-strong);
  }
  /* Reached */
  .goal.reached .fill { background: linear-gradient(90deg, var(--gold-2), var(--gold-1), var(--gold-2)); box-shadow: 0 0 1.6em rgba(255, 196, 0, 0.6), inset 0 0.15em 0 rgba(255, 255, 255, 0.4); }
  .goal.reached .pct { color: #3b2600; text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5); }
  .goal.reached .trophy { background: linear-gradient(145deg, var(--gold-1), var(--gold-2)); animation: wiggle 1.2s ease-in-out infinite; }
  .reached-badge {
    position: absolute;
    right: 1.1em;
    top: -0.9em;
    padding: 0.28em 0.8em;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--gold-2), var(--gold-1));
    color: #3b2600;
    font-weight: 850;
    font-size: 0.85em;
    box-shadow: 0 0.3em 1em rgba(255, 176, 32, 0.45);
    opacity: 0;
    transform: translateY(0.4em) scale(0.6);
    transition: opacity 0.3s ease, transform 0.5s var(--vx-ease-spring);
  }
  .goal.reached .reached-badge { opacity: 1; transform: none; }

  .burst { position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; }
  .burst i {
    position: absolute;
    width: var(--s);
    height: var(--s);
    margin: calc(var(--s) / -2);
    border-radius: var(--br);
    background: var(--c);
    animation: burst var(--d) cubic-bezier(0.15, 0.8, 0.3, 1) forwards;
  }

  /* ---------- customization ---------- */
  .title, .nums b { color: var(--text); }
  .nums { color: var(--text); opacity: 0.8; }
  .goal.style-solid { background: rgba(22, 22, 31, var(--pa)); -webkit-backdrop-filter: none; backdrop-filter: none; border-color: transparent; }
  .goal.style-minimal { background: none; border: none; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; padding: 0; }
  .goal.style-neon { background: rgba(8, 8, 18, var(--pa)); border: 1px solid var(--accent); box-shadow: 0 0 1.2em var(--accent), inset 0 0 1em rgba(0, 0, 0, 0.6); }
  .goal.style-neon .fill { box-shadow: 0 0 1.1em var(--accent-2), 0 0 0.4em var(--accent); }
  .goal.style-neon .title { text-shadow: 0 0 0.5em var(--accent); }
  .goal.no-stripes .fill::before, .goal.no-stripes .fill::after { display: none; }
  .goal.no-icon .trophy { display: none; }
  .goal.no-amounts .nums { display: none; }
  .goal.no-pct .pct { display: none; }
  @keyframes appear { from { opacity: 0; transform: translateY(0.8em) scale(0.98); } to { opacity: 1; transform: none; } }
  @keyframes stripes { to { background-position: 3.3em 0; } }
  @keyframes shimmer {
    0% { transform: translateX(-120%) skewX(-20deg); }
    60%, 100% { transform: translateX(320%) skewX(-20deg); }
  }
  @keyframes celebrate {
    0% { transform: scale(1); }
    35% { transform: scale(1.04); }
    100% { transform: scale(1); }
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(0); }
    25% { transform: rotate(-10deg); }
    75% { transform: rotate(10deg); }
  }
  @keyframes burst {
    0% { opacity: 1; transform: translate3d(0, 0, 0) scale(1) rotate(0); }
    70% { opacity: 1; }
    100% { opacity: 0; transform: translate3d(var(--x), var(--y), 0) scale(0.5) rotate(var(--r)); }
  }
</style>
</head>
<body>
<div id="root">
  <div class="goal" id="goal">
    <div class="reached-badge" id="badge"></div>
    <div class="head">
      <div class="title">
        <div class="trophy"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v2h3.5v2.5A4.5 4.5 0 0 1 16.6 12 5.5 5.5 0 0 1 13 14.8V17h3v2.5H8V17h3v-2.2A5.5 5.5 0 0 1 7.4 12 4.5 4.5 0 0 1 3.5 7.5V5H7zm0 4H5.5v.5A2.5 2.5 0 0 0 7.2 9.9 6 6 0 0 1 7 8.5zm10 0v1.5c0 .5 0 1-.2 1.4a2.5 2.5 0 0 0 1.7-2.4V7zM6.5 20.5h11V22h-11z"/></svg></div>
        <span id="title"></span>
      </div>
      <div class="nums"><b id="current"></b> / <span id="target"></span></div>
    </div>
    <div class="bar">
      <div class="fill empty" id="fill"></div>
      <div class="pct" id="pct">0%</div>
    </div>
    <div class="burst" id="burst"></div>
  </div>
</div>

<div id="designBox" hidden style="position:fixed;left:50%;top:50%;transform-origin:0 0"></div>
<script src="shared/widget.js"></script>
<script src="shared/alert-render.js"></script>
<script>
(function () {
  "use strict";
  var V = window.Vexcast;
  var $ = function (id) { return document.getElementById(id); };
  var goalEl = $("goal");

  var pos = V.param("position", "center");
  if (pos === "top" || pos === "bottom") $("root").classList.add(pos);

  function setAccent() {
    var c = V.param("color") || V.settings("alertBox").accentColor;
    if (c && /^#?[0-9a-f]{3,8}$/i.test(c)) document.documentElement.style.setProperty("--accent", c.charAt(0) === "#" ? c : "#" + c);
  }

  var shown = null; // number currently displayed (animated)
  var tweenRaf = 0;
  var reached = null;
  // ?type=followers|subs|bits: the other goals (their own settings); default: donations.
  var gtype = V.param("type", "");
  if (["followers", "subs", "bits"].indexOf(gtype) < 0) gtype = "";
  function readGoal() {
    if (!gtype) return V.settings("goal");
    var s = V.settings("goal", gtype);
    if (V.isDemo) {
      // Demo: follow the sample donation goal's progress.
      var d = V.settings("goal");
      s.current = d.target > 0 ? Math.round((d.current / d.target) * s.target) : 0;
    }
    return s;
  }
  var g = readGoal();

  function money(n) { return g.currency ? V.formatMoney(n, g.currency) : V.formatNumber(n); }

  function renderNumbers(val) {
    $("current").textContent = money(Math.round(val * 100) / 100);
  }

  function tweenTo(to) {
    cancelAnimationFrame(tweenRaf);
    var from = shown === null ? to : shown;
    var start = performance.now();
    var dur = Math.abs(to - from) < 0.01 ? 0 : 1100;
    (function frame(now) {
      var k = dur ? Math.min(1, (now - start) / dur) : 1;
      var e = 1 - Math.pow(1 - k, 3);
      shown = from + (to - from) * e;
      renderNumbers(k >= 1 ? to : (Number.isInteger(to) ? Math.round(shown) : shown));
      if (k < 1) tweenRaf = requestAnimationFrame(frame);
    })(start);
  }

  function burst() {
    var colors = ["#ffe066", "#ffb020", "#ffffff", "#ff6b9d", "#7c5cff", "#22d3ee", "#7cf29a"];
    var el = $("burst");
    var html = "";
    for (var i = 0; i < 46; i++) {
      var a = Math.random() * Math.PI * 2;
      var d = 4 + Math.random() * 14;
      html += '<i style="--x:' + (Math.cos(a) * d * 1.9).toFixed(2) + "em;--y:" + (Math.sin(a) * d * 0.7).toFixed(2) +
        "em;--s:" + (0.3 + Math.random() * 0.45).toFixed(2) + "em;--r:" + Math.round(Math.random() * 720) +
        "deg;--br:" + (Math.random() < 0.4 ? "50%" : "2px") + ";--c:" + colors[i % colors.length] +
        ";--d:" + (0.9 + Math.random() * 0.9).toFixed(2) + 's"></i>';
    }
    el.innerHTML = html;
    setTimeout(function () { el.innerHTML = ""; }, 2000);
  }

  var SYSTEM = /^(arial|impact|verdana|tahoma|georgia|times new roman|courier new|segoe ui|trebuchet ms|comic sans ms|system-ui|sans-serif|serif|monospace)$/i;
  var loadedFont = "";
  function loadFont(f) {
    f = String(f || "").trim();
    if (!f || f === loadedFont || SYSTEM.test(f)) return;
    loadedFont = f;
    var l = document.createElement("link");
    l.rel = "stylesheet";
    l.href = "https://fonts.googleapis.com/css2?family=" + encodeURIComponent(f).replace(/%20/g, "+") + ":wght@500;600;700;800;900&display=swap";
    document.head.appendChild(l);
  }
  function hex(c) { return typeof c === "string" && /^#[0-9a-f]{3,8}$/i.test(c) ? c : null; }

  /** Look: style, colors, font, bar, what to show. */
  function applyLook() {
    var r = document.documentElement.style;
    if (hex(g.color) && !V.param("color")) r.setProperty("--accent", g.color);
    if (hex(g.color2)) r.setProperty("--accent-2", g.color2);
    r.setProperty("--text", hex(g.textColor) || "#fff");
    r.setProperty("--pa", String(Math.max(0, Math.min(1, Number(g.bgOpacity)))));
    r.setProperty("--bar-h", Math.max(0.4, Math.min(5, Number(g.barHeight) || 2.1)) + "em");
    r.setProperty("--bar-r", g.rounded === false ? "0.25em" : "999px");
    r.setProperty("--font", g.fontFamily ? "'" + String(g.fontFamily).replace(/'/g, "") + "', system-ui, sans-serif" : "inherit");
    loadFont(g.fontFamily);
    var style = ["glass", "solid", "minimal", "neon"].indexOf(g.style) >= 0 ? g.style : "glass";
    goalEl.classList.remove("style-glass", "style-solid", "style-minimal", "style-neon");
    goalEl.classList.add("style-" + style);
    goalEl.classList.toggle("no-stripes", g.stripes === false);
    goalEl.classList.toggle("no-icon", g.showIcon === false);
    goalEl.classList.toggle("no-amounts", g.showAmounts === false);
    goalEl.classList.toggle("no-pct", g.showPercent === false);
  }

  // ---------- layer editor design ----------
  var designBox = document.getElementById("designBox");
  var designed = null;
  var designKey = "";
  var designVals = "";
  function mediaUrl(p) {
    if (!p) return "";
    if (/^(https?|data|blob):/i.test(p)) return p;
    return V.url("/api/v1/files?path=" + encodeURIComponent(p));
  }
  function fitDesign() {
    if (!designed) return;
    var sc = Math.min(window.innerWidth / designed.width, window.innerHeight / designed.height);
    designBox.style.transform = "scale(" + sc + ") translate(-50%, -50%)";
  }
  window.addEventListener("resize", fitDesign);
  /** true when the goal uses a layer design (and it was rendered/updated). */
  function designMode() {
    var dz = g.designEnabled && g.design && window.VexcastAlertRender ? g.design : null;
    var rootEl = $("root");
    if (!dz) {
      if (designed) { designBox.innerHTML = ""; designed = null; designKey = ""; }
      designBox.hidden = true;
      rootEl.hidden = false;
      return false;
    }
    rootEl.hidden = true;
    designBox.hidden = false;
    var current = Math.max(0, Number(g.current) || 0);
    var target = Math.max(0, Number(g.target) || 0);
    var ev = { goal: true, title: g.title || "", currency: g.currency || "", current: current, target: target, reached: target > 0 && current >= target };
    var key = JSON.stringify(dz);
    var vals = JSON.stringify(ev);
    if (key !== designKey || !designed || (dz.customEnabled && vals !== designVals)) {
      designBox.innerHTML = "";
      designed = window.VexcastAlertRender.render(dz, ev, { mode: "play", audio: false, mediaUrl: mediaUrl });
      designBox.appendChild(designed.el);
      designKey = key;
      fitDesign();
    } else if (vals !== designVals) {
      designed.update(ev);
    }
    designVals = vals;
    return true;
  }

  function update() {
    g = readGoal();
    if (designMode()) return;
    setAccent();
    applyLook();
    var current = Math.max(0, Number(g.current) || 0);
    var target = Math.max(0, Number(g.target) || 0);
    var pct = target > 0 ? Math.min(100, (current / target) * 100) : 0;

    $("title").textContent = g.title || "";
    $("target").textContent = money(target);
    $("pct").textContent = (pct >= 10 || pct === 0 ? Math.floor(pct) : pct.toFixed(1).replace(".", V.lang() === "en" ? "." : ",")) + "%";
    $("badge").textContent = g.reachedText || V.t("goalReached");
    var fill = $("fill");
    fill.classList.toggle("empty", pct <= 0);
    fill.style.width = pct + "%";
    tweenTo(current);

    var isReached = target > 0 && current >= target;
    if (isReached && reached === false) {
      goalEl.classList.remove("reached");
      void goalEl.offsetWidth;
      if (g.celebrate !== false) setTimeout(burst, 650);
    }
    goalEl.classList.toggle("reached", isReached && g.celebrate !== false);
    reached = isReached;
  }

  V.on("state", update);
  update();
})();
</script>
</body>
</html>
