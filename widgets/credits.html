<!doctype html>
<!-- Vexcast end-of-stream credits. SPDX-License-Identifier: GPL-3.0-or-later -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Vexcast · Créditos</title>
<link rel="stylesheet" href="shared/widget.css">
<style>
  html, body { background: transparent; }
  :root { --fs: 34px; --font: inherit; --text: #fff; --accent: #a78bfa; --bg: transparent; }
  #frame { position: fixed; inset: 0; overflow: hidden; background: var(--bg); font-size: var(--fs); font-family: var(--font); color: var(--text); -webkit-mask-image: linear-gradient(transparent, #000 10%, #000 90%, transparent); mask-image: linear-gradient(transparent, #000 10%, #000 90%, transparent); }
  #roll { position: absolute; left: 0; right: 0; top: 0; text-align: center; padding: 0 6%; will-change: transform; }
  .title { font-size: 1.6em; font-weight: 900; line-height: 1.15; text-shadow: var(--vx-outline-strong); }
  .subtitle { margin-top: 0.3em; font-size: 0.8em; opacity: 0.8; text-shadow: var(--vx-outline); }
  .section { margin-top: 2.2em; }
  .section h2 { margin: 0 0 0.5em; font-size: 0.72em; font-weight: 800; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent); text-shadow: var(--vx-outline); }
  .names { display: flex; flex-direction: column; gap: 0.25em; font-weight: 700; text-shadow: var(--vx-outline-strong); }
  .names span small { margin-left: 0.4em; font-size: 0.7em; font-weight: 600; opacity: 0.7; }
  .no-amounts small { display: none; }
  .outro { margin-top: 3em; font-size: 1.1em; font-weight: 800; text-shadow: var(--vx-outline-strong); }
  .empty { margin-top: 2em; opacity: 0.7; font-size: 0.8em; }
</style>
</head>
<body>
<div id="frame"><div id="roll"></div></div>
<script src="shared/widget.js"></script>
<script>
(function () {
  "use strict";
  var V = window.Vexcast;
  var roll = document.getElementById("roll");
  var data = null;
  var y = 0;
  var last = 0;
  var key = "";

  var DEMO = {
    follows: ["NovaCat", "Kira", "Dani", "Bea_live", "Tomás"],
    subs: ["PixelKnight", "Luna"],
    gifts: [{ user: "ElProfe", amount: 5 }],
    bits: [{ user: "Sofi_gg", amount: 500 }],
    donations: [{ user: "ElProfe", amount: 10 }, { user: "Mateo_Dev", amount: 3 }],
    raids: [{ user: "Mateo_Dev", amount: 42 }],
    chatters: [{ user: "Luna", amount: 128 }, { user: "Kira", amount: 97 }, { user: "Dani", amount: 64 }]
  };

  function cur() {
    var d = (V.state && V.state.labels && V.state.labels.latest && V.state.labels.latest.donation && V.state.labels.latest.donation.currency) || (V.state && V.state.widgets && V.state.widgets.goal && V.state.widgets.goal.currency) || "EUR";
    return d;
  }

  function amount(section, n) {
    if (section === "donations") return V.formatMoney(n, cur());
    if (section === "bits") return V.formatNumber(n) + " bits";
    if (section === "gifts") return "× " + V.formatNumber(n);
    if (section === "raids") return V.formatNumber(n);
    if (section === "chatters") return V.t("creditsMsgs", { n: V.formatNumber(n) });
    return "";
  }

  function build() {
    var s = V.settings("credits");
    var r = document.documentElement.style;
    r.setProperty("--fs", Math.max(12, Number(s.fontSize) || 34) + "px");
    r.setProperty("--text", /^#[0-9a-f]{3,8}$/i.test(s.textColor) ? s.textColor : "#fff");
    if (/^#[0-9a-f]{3,8}$/i.test(s.accentColor)) r.setProperty("--accent", s.accentColor);
    r.setProperty("--bg", V.rgba(s.bgColor || "#000000", s.bgOpacity || 0));
    r.setProperty("--font", V.fontStack(s.fontFamily) || "inherit");
    V.loadFont(s.fontFamily);
    var d = V.isDemo ? DEMO : data || {};
    var html = '<div class="title">' + V.escapeHtml(s.title || "") + "</div>" + (s.subtitle ? '<div class="subtitle">' + V.escapeHtml(s.subtitle) + "</div>" : "");
    var any = false;
    (s.sections || []).forEach(function (sec) {
      var list = d[sec] || [];
      if (!list.length) return;
      any = true;
      html += '<div class="section"><h2>' + V.escapeHtml(V.t("credits." + sec)) + '</h2><div class="names">' +
        list.map(function (x) {
          if (typeof x === "string") return "<span>" + V.escapeHtml(x) + "</span>";
          return "<span>" + V.escapeHtml(x.user) + "<small>" + V.escapeHtml(amount(sec, x.amount)) + "</small></span>";
        }).join("") + "</div></div>";
    });
    if (!any) html += '<div class="empty">' + V.escapeHtml(V.t("creditsEmpty")) + "</div>";
    if (s.outro) html += '<div class="outro">' + V.escapeHtml(s.outro) + "</div>";
    roll.innerHTML = html;
    roll.classList.toggle("no-amounts", s.showAmounts === false);
  }

  function frame(now) {
    var s = V.settings("credits");
    var dt = last ? Math.min(0.1, (now - last) / 1000) : 0;
    last = now;
    var h = roll.offsetHeight;
    var H = window.innerHeight;
    y -= (Number(s.speed) || 60) * dt;
    if (y < -h) y = s.repeat === false ? -h : H;
    roll.style.transform = "translateY(" + y + "px)";
    requestAnimationFrame(frame);
  }

  function load() {
    if (V.isDemo) return build();
    fetch(V.url("/api/v1/credits")).then(function (r) { return r.ok ? r.json() : null; }).then(function (x) {
      if (!x) return;
      var k = JSON.stringify(x);
      if (k !== key) { key = k; data = x; build(); }
    }).catch(function () {});
  }

  V.on("state", function () { build(); });
  V.on("alert", function () { setTimeout(load, 1500); });
  y = window.innerHeight;
  load();
  build();
  setInterval(load, 30000);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
