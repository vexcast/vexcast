<!doctype html>
<!-- Vexcast audio-reactive widget: bars, ring, glowing frame or wave that move with a source's
     audio. ?source=<uuid> (empty = the loudest), style=bars|ring|glow|wave, color, color2,
     gain (sensitivity, 0.5–3), demo=1 for a preview without sound.
     SPDX-License-Identifier: GPL-3.0-or-later -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Vexcast · Audio</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="shared/widget.js"></script>
<script>
(function () {
  "use strict";
  var V = window.Vexcast;
  var p = new URLSearchParams(location.search);
  var source = p.get("source") || "";
  var style = p.get("style") || "bars";
  var color = "#" + (p.get("color") || "8b5cf6").replace(/^#/, "");
  var color2 = "#" + (p.get("color2") || "22d3ee").replace(/^#/, "");
  var gain = Math.min(3, Math.max(0.5, Number(p.get("gain")) || 1));
  var demo = /^(1|true)$/i.test(p.get("demo") || "");

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  // dBFS (-60..0) -> 0..1, with the sensitivity applied.
  var target = 0, level = 0, peakHold = 0;
  function toUnit(db) { return Math.max(0, Math.min(1, ((db + 60) / 60) * gain)); }
  V.on("levels", function (list) {
    if (!list || !list.length) return;
    var best = -100;
    for (var i = 0; i < list.length; i++) {
      var l = list[i];
      if (source && l.sourceUuid !== source) continue;
      for (var c = 0; c < l.magnitude.length; c++) best = Math.max(best, l.magnitude[c]);
    }
    target = toUnit(best);
  });

  // Smooth: fast attack, slow release.
  var bars = 40, heights = [];
  for (var b = 0; b < bars; b++) heights.push(0);
  function noise(i, t) { return 0.5 + 0.5 * Math.sin(i * 1.7 + t * 3.1) * Math.cos(i * 0.6 - t * 1.3); }

  function gradient(x0, y0, x1, y1) {
    var g = ctx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, color); g.addColorStop(1, color2);
    return g;
  }

  function frame(ts) {
    var t = ts / 1000;
    if (demo) target = Math.max(0, 0.35 + 0.35 * Math.sin(t * 2.2) + 0.25 * Math.sin(t * 7.3)) * gain;
    level += (target - level) * (target > level ? 0.45 : 0.08);
    peakHold = Math.max(level, peakHold - 0.01);
    ctx.clearRect(0, 0, W, H);

    if (style === "ring") {
      var cx = W / 2, cy = H / 2, base = Math.min(W, H) * 0.32;
      var r = base * (1 + level * 0.22);
      ctx.save();
      ctx.shadowColor = color; ctx.shadowBlur = 20 + level * 60;
      ctx.lineWidth = 4 + level * 14;
      ctx.strokeStyle = gradient(cx - r, cy - r, cx + r, cy + r);
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
      // Spikes around the ring.
      ctx.strokeStyle = color2; ctx.lineWidth = 3; ctx.lineCap = "round";
      for (var k = 0; k < 64; k++) {
        var a = (k / 64) * Math.PI * 2;
        var len = level * base * 0.35 * noise(k, t);
        ctx.globalAlpha = 0.5 + level * 0.5;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(a) * (r + 10), cy + Math.sin(a) * (r + 10));
        ctx.lineTo(cx + Math.cos(a) * (r + 10 + len), cy + Math.sin(a) * (r + 10 + len));
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    } else if (style === "glow") {
      // A frame that glows with the voice (put it over the camera).
      var m = 6 + level * 4;
      ctx.save();
      ctx.shadowColor = color; ctx.shadowBlur = 10 + level * 70;
      ctx.lineWidth = 3 + level * 9;
      ctx.strokeStyle = gradient(0, 0, W, H);
      ctx.globalAlpha = 0.45 + level * 0.55;
      var rr = Math.min(W, H) * 0.04;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(m, m, W - m * 2, H - m * 2, rr) : ctx.rect(m, m, W - m * 2, H - m * 2);
      ctx.stroke();
      ctx.restore();
    } else if (style === "wave") {
      ctx.lineWidth = 4; ctx.lineCap = "round";
      for (var w = 0; w < 3; w++) {
        ctx.strokeStyle = w === 1 ? color2 : color;
        ctx.globalAlpha = w === 0 ? 1 : 0.45;
        ctx.beginPath();
        for (var x = 0; x <= W; x += 6) {
          var y = H / 2 + Math.sin(x / W * Math.PI * (3 + w) + t * (2 + w)) * (H * 0.4) * level * Math.sin(x / W * Math.PI);
          if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    } else {
      // Bars from the bottom (a lively spectrum-like look driven by the level).
      var gap = 4, bw = (W - gap * (bars - 1)) / bars;
      ctx.fillStyle = gradient(0, H, 0, 0);
      for (var i2 = 0; i2 < bars; i2++) {
        var want = H * level * (0.25 + 0.75 * noise(i2, t)) * (0.6 + 0.4 * Math.sin((i2 / bars) * Math.PI));
        heights[i2] += (want - heights[i2]) * 0.35;
        var h = Math.max(3, heights[i2]);
        var x0 = i2 * (bw + gap);
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(x0, H - h, bw, h, [Math.min(4, bw / 2), Math.min(4, bw / 2), 0, 0]); else ctx.rect(x0, H - h, bw, h);
        ctx.fill();
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
