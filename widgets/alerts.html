<!doctype html>
<!-- Vexcast alert box widget. SPDX-License-Identifier: GPL-3.0-or-later -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Vexcast · Alertas</title>
<link rel="stylesheet" href="shared/widget.css">
<style>
  :root {
    /* One unit that scales with the browser source: 19.2px at 1920x1080 */
    --u: min(1vw, 1.78vh);
    --accent: #7c5cff;
    --accent-rgb: 124, 92, 255;
    --accent-light: #b3a0ff;
    --accent-deep: #3d2a99;
  }

  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .alert {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    width: min(92vw, calc(var(--u) * 78));
    padding: calc(var(--u) * 1);
  }

  /* ---------- Graphic ---------- */
  .graphic {
    position: relative;
    width: calc(var(--u) * 13);
    height: calc(var(--u) * 13);
    margin-bottom: calc(var(--u) * 0.6);
  }
  .graphic > * {
    position: absolute;
    inset: 0;
    border-radius: 50%;
  }
  .glow {
    inset: -35%;
    background: radial-gradient(circle, rgba(var(--accent-rgb), 0.55) 0%, rgba(var(--accent-rgb), 0.18) 38%, rgba(var(--accent-rgb), 0) 68%);
    animation: glowPulse 2.4s ease-in-out infinite;
  }
  .rays {
    inset: -42%;
    background: repeating-conic-gradient(from 0deg, rgba(255, 255, 255, 0.22) 0deg 5deg, rgba(255, 255, 255, 0) 5deg 22.5deg);
    -webkit-mask: radial-gradient(circle, transparent 24%, #000 34%, transparent 70%);
    mask: radial-gradient(circle, transparent 24%, #000 34%, transparent 70%);
    animation: spin 14s linear infinite;
    opacity: 0.85;
  }
  .ring {
    border: calc(var(--u) * 0.28) solid rgba(var(--accent-rgb), 0.9);
    opacity: 0;
    animation: ringOut 2.2s var(--vx-ease-out) infinite;
  }
  .ring.r2 { animation-delay: 0.73s; border-color: rgba(255, 255, 255, 0.7); }
  .ring.r3 { animation-delay: 1.46s; }
  .emblem {
    inset: 14%;
    display: grid;
    place-items: center;
    background:
      radial-gradient(circle at 32% 26%, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0) 42%),
      linear-gradient(145deg, var(--accent-light), var(--accent) 48%, var(--accent-deep));
    box-shadow:
      0 0 0 calc(var(--u) * 0.32) rgba(255, 255, 255, 0.9),
      0 0 0 calc(var(--u) * 0.6) rgba(var(--accent-rgb), 0.55),
      0 calc(var(--u) * 0.6) calc(var(--u) * 2.4) rgba(0, 0, 0, 0.45),
      inset 0 calc(var(--u) * -0.5) calc(var(--u) * 1.2) rgba(0, 0, 0, 0.25);
    animation: float 3s ease-in-out infinite;
  }
  .emblem svg {
    width: 54%;
    height: 54%;
    fill: #fff;
    filter: drop-shadow(0 calc(var(--u) * 0.15) calc(var(--u) * 0.3) rgba(0, 0, 0, 0.35));
  }
  .emblem svg .d { fill: var(--accent-deep); }
  .emblem svg .s { fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .emblem svg .ds { fill: none; stroke: var(--accent-deep); stroke-width: 1.3; stroke-linejoin: round; }

  .confetti { inset: 50% auto auto 50%; width: 0; height: 0; border-radius: 0; overflow: visible; }
  .confetti i {
    position: absolute;
    left: 0;
    top: 0;
    width: var(--w);
    height: var(--h);
    margin: calc(var(--h) / -2) 0 0 calc(var(--w) / -2);
    background: var(--c);
    border-radius: var(--br);
    opacity: 0;
    animation: confetti var(--d) cubic-bezier(0.2, 0.7, 0.4, 1) var(--delay) forwards;
  }

  /* ---------- Text ---------- */
  .label {
    display: inline-flex;
    align-items: center;
    gap: calc(var(--u) * 0.5);
    padding: calc(var(--u) * 0.32) calc(var(--u) * 0.95) calc(var(--u) * 0.32) calc(var(--u) * 0.5);
    margin-bottom: calc(var(--u) * 0.7);
    border-radius: 999px;
    background: rgba(12, 10, 24, 0.66);
    border: 1px solid rgba(255, 255, 255, 0.16);
    box-shadow: 0 calc(var(--u) * 0.3) calc(var(--u) * 1.2) rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(var(--accent-rgb), 0.35);
    font-size: calc(var(--u) * 0.95);
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.92);
  }
  .label .vx-icon { font-size: 1.35em; }
  .label .extra { color: var(--accent-light); }

  .title {
    font-family: var(--vx-font-display);
    font-size: calc(var(--u) * 3);
    line-height: 1.12;
    font-weight: 850;
    letter-spacing: -0.015em;
    color: #fff;
    text-shadow: var(--vx-outline-strong);
    overflow-wrap: anywhere;
    max-width: 100%;
  }
  .title .user {
    color: var(--accent-light);
    background: linear-gradient(180deg, #fff 0%, var(--accent-light) 70%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.55)) drop-shadow(0 4px 12px rgba(0, 0, 0, 0.45));
    text-shadow: none;
  }
  .title .amount {
    display: inline-block;
    color: #ffe066;
    animation: amountPop 0.9s var(--vx-ease-spring) 0.55s both;
  }
  .message {
    margin-top: calc(var(--u) * 0.9);
    max-width: calc(var(--u) * 60);
    padding: calc(var(--u) * 0.7) calc(var(--u) * 1.3);
    border-radius: calc(var(--u) * 0.9);
    background: rgba(10, 10, 18, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.1);
    font-size: calc(var(--u) * 1.45);
    line-height: 1.35;
    font-weight: 550;
    color: rgba(255, 255, 255, 0.96);
    text-shadow: var(--vx-outline);
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    overflow-wrap: anywhere;
  }

  /* ---------- Custom media (per-type variations) ---------- */
  .media {
    position: relative;
    width: calc(var(--u) * 26 * var(--media-scale, 1));
    max-width: 92vw;
    max-height: 62vh;
    margin-bottom: calc(var(--u) * 0.6);
    display: flex;
    justify-content: center;
  }
  .media img, .media video {
    max-width: 100%;
    max-height: 62vh;
    object-fit: contain;
    filter: drop-shadow(0 calc(var(--u) * 0.4) calc(var(--u) * 1.2) rgba(0, 0, 0, 0.45));
  }
  .layout-side { flex-direction: row; align-items: center; text-align: left; gap: calc(var(--u) * 1.5); width: min(96vw, calc(var(--u) * 92)); }
  .layout-side .media { margin-bottom: 0; flex: none; width: calc(var(--u) * 20 * var(--media-scale, 1)); }
  .layout-side .text { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
  .layout-background { justify-content: center; }
  .layout-background .media { position: absolute; inset: 0; margin: auto; height: fit-content; width: calc(var(--u) * 60 * var(--media-scale, 1)); z-index: 0; }
  .layout-background .text { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; }
  .text { display: contents; }

  /* ---------- Enter animations (staggered parts) ---------- */
  .alert .graphic, .alert .media, .alert .label, .alert .title, .alert .message { animation-fill-mode: both; }

  .anim-pop .media { animation: popIn 0.7s var(--vx-ease-spring) both; }
  .anim-slide .media { animation: slideIn 0.7s var(--vx-ease-out) both; }
  .anim-fade .media { animation: fadeIn 0.9s ease-out both; }
  .anim-bounce .media { animation: bounceIn 1s linear both; }
  .layout-background.anim-pop .media, .layout-background.anim-slide .media, .layout-background.anim-fade .media, .layout-background.anim-bounce .media { animation: fadeIn 0.6s ease-out both; }

  .anim-pop .graphic { animation: popIn 0.7s var(--vx-ease-spring) both; }
  .anim-pop .label   { animation: popIn 0.6s var(--vx-ease-spring) 0.12s both; }
  .anim-pop .title   { animation: popIn 0.65s var(--vx-ease-spring) 0.2s both; }
  .anim-pop .message { animation: popIn 0.6s var(--vx-ease-spring) 0.32s both; }

  .anim-slide .graphic { animation: slideIn 0.7s var(--vx-ease-out) both; }
  .anim-slide .label   { animation: slideIn 0.7s var(--vx-ease-out) 0.08s both; }
  .anim-slide .title   { animation: slideIn 0.75s var(--vx-ease-out) 0.16s both; }
  .anim-slide .message { animation: slideIn 0.75s var(--vx-ease-out) 0.26s both; }

  .anim-fade .graphic { animation: fadeIn 0.9s ease-out both; }
  .anim-fade .label   { animation: fadeIn 0.9s ease-out 0.15s both; }
  .anim-fade .title   { animation: fadeIn 0.9s ease-out 0.25s both; }
  .anim-fade .message { animation: fadeIn 0.9s ease-out 0.4s both; }

  .anim-bounce .graphic { animation: bounceIn 1s linear both; }
  .anim-bounce .label   { animation: bounceIn 1s linear 0.1s both; }
  .anim-bounce .title   { animation: bounceIn 1s linear 0.18s both; }
  .anim-bounce .message { animation: bounceIn 1s linear 0.28s both; }

  /* Exit: one animation on the whole alert */
  .alert.leaving { animation: leave 0.55s cubic-bezier(0.5, 0, 0.75, 0) forwards; }
  .anim-slide.leaving { animation-name: leaveSlide; }
  .anim-fade.leaving { animation-name: leaveFade; animation-duration: 0.7s; }

  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.3); }
    60% { opacity: 1; transform: scale(1.06); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translate3d(0, calc(var(--u) * 5), 0); }
    to { opacity: 1; transform: none; }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.97); }
    to { opacity: 1; transform: none; }
  }
  @keyframes bounceIn {
    0% { opacity: 0; transform: translate3d(0, -60vh, 0); animation-timing-function: cubic-bezier(0.55, 0, 1, 0.45); }
    40% { opacity: 1; transform: translate3d(0, 0, 0) scale(1.04, 0.94); animation-timing-function: cubic-bezier(0, 0.55, 0.45, 1); }
    58% { transform: translate3d(0, calc(var(--u) * -3), 0); animation-timing-function: cubic-bezier(0.55, 0, 1, 0.45); }
    74% { transform: translate3d(0, 0, 0) scale(1.02, 0.97); animation-timing-function: cubic-bezier(0, 0.55, 0.45, 1); }
    86% { transform: translate3d(0, calc(var(--u) * -0.9), 0); animation-timing-function: cubic-bezier(0.55, 0, 1, 0.45); }
    100% { opacity: 1; transform: none; }
  }
  @keyframes leave { to { opacity: 0; transform: scale(0.92) translate3d(0, calc(var(--u) * -1.5), 0); } }
  @keyframes leaveSlide { to { opacity: 0; transform: translate3d(0, calc(var(--u) * -6), 0); } }
  @keyframes leaveFade { to { opacity: 0; } }

  @keyframes glowPulse {
    0%, 100% { transform: scale(0.92); opacity: 0.85; }
    50% { transform: scale(1.06); opacity: 1; }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes ringOut {
    0% { transform: scale(0.75); opacity: 0.9; }
    100% { transform: scale(1.75); opacity: 0; }
  }
  @keyframes float {
    0%, 100% { transform: translate3d(0, 0, 0) rotate(-3deg); }
    50% { transform: translate3d(0, calc(var(--u) * -0.5), 0) rotate(3deg); }
  }
  @keyframes amountPop {
    0% { transform: scale(1); }
    40% { transform: scale(1.18) rotate(-2deg); }
    100% { transform: scale(1); }
  }
  @keyframes confetti {
    0% { opacity: 1; transform: translate3d(0, 0, 0) rotate(0deg) scale(0.4); }
    12% { opacity: 1; }
    45% { transform: translate3d(var(--x), var(--y), 0) rotate(calc(var(--r) * 0.5)) scale(1); }
    85% { opacity: 1; }
    100% { opacity: 0; transform: translate3d(calc(var(--x) * 1.2), calc(var(--y) + var(--fall)), 0) rotate(var(--r)) scale(0.9); }
  }
</style>
</head>
<body>
<div id="stage" aria-live="polite"></div>

<script src="shared/widget.js"></script>
<script src="shared/alert-render.js"></script>
<script>
(function () {
  "use strict";
  var V = window.Vexcast;
  var stage = document.getElementById("stage");


  // ---------------------------------------------------------------
  // Accent colour helpers (no color-mix, works on older CEF builds)
  // ---------------------------------------------------------------
  function parseHex(hex) {
    var m = String(hex || "").trim().replace("#", "");
    if (m.length === 3 || m.length === 4) m = m.split("").map(function (c) { return c + c; }).join("");
    if (!/^[0-9a-f]{6}/i.test(m)) return null;
    return [parseInt(m.slice(0, 2), 16), parseInt(m.slice(2, 4), 16), parseInt(m.slice(4, 6), 16)];
  }
  function mix(rgb, target, amt) {
    return "rgb(" + rgb.map(function (c, i) { return Math.round(c + (target[i] - c) * amt); }).join(",") + ")";
  }
  var lastAccent = null;
  function applyAccent(color) {
    if (color === lastAccent) return;
    lastAccent = color;
    var rgb = parseHex(color) || [124, 92, 255];
    var root = document.documentElement.style;
    root.setProperty("--accent", "rgb(" + rgb.join(",") + ")");
    root.setProperty("--accent-rgb", rgb.join(","));
    root.setProperty("--accent-light", mix(rgb, [255, 255, 255], 0.45));
    root.setProperty("--accent-deep", mix(rgb, [0, 0, 0], 0.5));
  }

  // ---------------------------------------------------------------
  // Audio (only with ?audio=1: the core mixes alert audio into the stream)
  // ---------------------------------------------------------------
  var audioChain = Promise.resolve();
  var currentAudio = null;
  var currentStop = null;

  function enqueueAudio(task) {
    var p = audioChain.then(function () { return task().catch(function () {}); });
    audioChain = p;
    return p;
  }

  function playUrl(src, volume, maxMs) {
    return new Promise(function (resolve) {
      if (!src) return resolve();
      var done = false;
      var a = new Audio();
      var timer = setTimeout(finish, maxMs || 60000);
      function finish() {
        if (done) return;
        done = true;
        clearTimeout(timer);
        try { a.pause(); } catch (e) { /* ignore */ }
        if (currentAudio === a) { currentAudio = null; currentStop = null; }
        resolve();
      }
      currentAudio = a;
      currentStop = finish;
      a.preload = "auto";
      a.volume = Math.max(0, Math.min(1, volume > 1 ? volume / 100 : volume));
      a.onended = finish;
      a.onerror = finish;
      a.src = src;
      var pr = a.play();
      if (pr && pr.catch) pr.catch(finish);
    });
  }

  function speak(text) {
    return new Promise(function (resolve) {
      var synth = window.speechSynthesis;
      if (!synth || !text || typeof SpeechSynthesisUtterance === "undefined") return resolve();
      var done = false;
      var timer = setTimeout(finish, Math.min(30000, 2500 + text.length * 120));
      function finish() {
        if (done) return;
        done = true;
        clearTimeout(timer);
        if (currentStop === finish) currentStop = null;
        try { synth.cancel(); } catch (e) { /* ignore */ }
        resolve();
      }
      currentStop = finish;
      var u = new SpeechSynthesisUtterance(text);
      u.lang = V.locale();
      var voices = synth.getVoices() || [];
      var prefix = V.lang();
      for (var i = 0; i < voices.length; i++) {
        if (voices[i].lang && voices[i].lang.toLowerCase().indexOf(prefix) === 0) { u.voice = voices[i]; break; }
      }
      u.onend = finish;
      u.onerror = finish;
      try { synth.speak(u); } catch (e) { finish(); }
    });
  }

  function stopAudio() {
    if (currentStop) currentStop();
  }

  function shouldSpeak(ev, s) {
    var v = variationFor(ev, s);
    var on = v.tts === "on" ? true : v.tts === "off" ? false : s.ttsEnabled;
    if (!on || !ev.message) return false;
    if (V.isMoneyAlert(ev.type) || ev.type === "bits") {
      return !(s.ttsMinAmount > 0) || (ev.amount || 0) >= s.ttsMinAmount;
    }
    return true;
  }

  function alertAudio(ev, s) {
    if (!V.audioEnabled) return Promise.resolve();
    var v = variationFor(ev, s);
    // A video without its own sound plays its audio from the <video> element.
    var src = v.sound ? mediaUrl(v.sound) : v.media && isVideo(v.media) ? "" : s.soundUrl ? V.url(s.soundUrl) : "";
    var vol = v.soundVolume >= 0 ? v.soundVolume : s.soundVolume;
    return enqueueAudio(function () {
      return playUrl(src, vol, 15000).then(function () {
        if (ev.ttsUrl) return playUrl(V.url(ev.ttsUrl), 1, 60000);
        if (shouldSpeak(ev, s)) return speak(ev.message);
      });
    });
  }

  // Generic speech requests from the core (co-host, !tts, ...).
  var seenTts = {};
  V.on("tts", function (data) {
    // Already playing in the stream mix: playing it here too would sound twice.
    if (!V.audioEnabled || !data || !data.url || data.played || seenTts[data.id]) return;
    seenTts[data.id] = 1;
    enqueueAudio(function () { return playUrl(V.url(data.url), 1, 60000); });
  });

  // ---------------------------------------------------------------
  // Rendering
  // ---------------------------------------------------------------
  function amountText(ev, tpl) {
    if (ev.amount === null || ev.amount === undefined) return "";
    if (V.isMoneyAlert(ev.type) && tpl.indexOf("{currency}") === -1) return V.formatMoney(ev.amount, ev.currency);
    return V.formatNumber(ev.amount, 2);
  }

  function templateFor(ev, s) {
    var custom = s.templates && s.templates[ev.type];
    if (typeof custom === "string" && custom.trim()) return custom;
    if (ev.type === "gift_sub" && !(ev.amount > 1)) {
      return V.lang() === "en" ? "{user} gifted a sub!" : "¡{user} regaló una suscripción!";
    }
    return V.t("tpl." + ev.type) === "tpl." + ev.type ? "{user}" : V.t("tpl." + ev.type);
  }

  function renderTitle(ev, tpl) {
    var amount = amountText(ev, tpl);
    var html = V.escapeHtml(tpl).replace(/\{(user|amount|currency|message)\}/g, function (m, key) {
      if (key === "user") return '<span class="user">' + V.escapeHtml(ev.user || "Anónimo") + "</span>";
      if (key === "amount") return amount ? '<span class="amount">' + V.escapeHtml(amount) + "</span>" : "";
      if (key === "currency") return V.escapeHtml(ev.currency || "");
      return V.escapeHtml(ev.message || "");
    });
    return html.replace(/\s{2,}/g, " ").replace(/\s+([!?.,:])/g, "$1");
  }

  var CONFETTI_COLORS = ["var(--accent)", "var(--accent-light)", "#ffe066", "#ff6b9d", "#5ce1e6", "#ffffff", "#7cf29a"];

  function confetti(container) {
    var html = "";
    var n = 44;
    for (var i = 0; i < n; i++) {
      var ang = (i / n) * Math.PI * 2 + Math.random() * 0.4;
      var dist = 7 + Math.random() * 11; // in --u
      var w = 0.35 + Math.random() * 0.45;
      var h = Math.random() < 0.5 ? w : w * (1.8 + Math.random());
      html +=
        '<i style="' +
        "--x:calc(var(--u)*" + (Math.cos(ang) * dist * 1.6).toFixed(2) + ");" +
        "--y:calc(var(--u)*" + (Math.sin(ang) * dist - 3).toFixed(2) + ");" +
        "--fall:calc(var(--u)*" + (5 + Math.random() * 7).toFixed(2) + ");" +
        "--r:" + Math.round((Math.random() - 0.5) * 1080) + "deg;" +
        "--w:calc(var(--u)*" + w.toFixed(2) + ");" +
        "--h:calc(var(--u)*" + h.toFixed(2) + ");" +
        "--br:" + (Math.random() < 0.3 ? "50%" : "2px") + ";" +
        "--c:" + CONFETTI_COLORS[i % CONFETTI_COLORS.length] + ";" +
        "--d:" + (1.6 + Math.random() * 1.1).toFixed(2) + "s;" +
        "--delay:" + (0.12 + Math.random() * 0.25).toFixed(2) + 's"></i>';
    }
    container.innerHTML = html;
  }

  /** Per-type variation (Streamlabs-style), {} when the type uses the global look. */
  function variationFor(ev, s) {
    var v = s.variations && s.variations[ev.type];
    return v && typeof v === "object" ? v : {};
  }

  function isVideo(p) {
    return /\.(webm|mp4|mov|mkv)(\?|$)/i.test(String(p || ""));
  }

  /** Local media lives in Vexcast's data folder and is served by the core. */
  function mediaUrl(p) {
    if (!p) return "";
    if (/^(https?|data|blob):/i.test(p)) return p;
    return V.url("/api/v1/files?path=" + encodeURIComponent(p));
  }

  function buildAlert(ev, s) {
    var v = variationFor(ev, s);
    var tpl = templateFor(ev, s);
    var animName = v.animation || s.animation;
    var anim = ["pop", "slide", "fade", "bounce"].indexOf(animName) >= 0 ? animName : "pop";
    var layout = ["above", "side", "background"].indexOf(v.layout) >= 0 ? v.layout : "above";
    var el = document.createElement("div");
    el.className = "alert anim-" + anim + " type-" + ev.type + (v.media ? " layout-" + layout : "");

    var extra = "";
    if (ev.type === "subscription" && ev.amount > 1) extra = V.t("months", { amount: V.formatNumber(ev.amount) });
    else if (ev.test) extra = V.lang() === "en" ? "test" : "prueba";

    var showMessage = ev.message && tpl.indexOf("{message}") === -1 && v.showMessage !== false;

    var graphic;
    if (v.media) {
      var src = V.escapeHtml(mediaUrl(v.media));
      // The core plays the alert sound into the stream; the widget only plays audio with ?audio=1.
      var unmute = V.audioEnabled && !v.sound;
      graphic =
        '<div class="media">' +
        (isVideo(v.media)
          ? '<video src="' + src + '" autoplay playsinline' + (unmute ? "" : " muted") + "></video>"
          : '<img src="' + src + '" alt="">') +
        "</div>";
    } else {
      graphic =
        '<div class="graphic">' +
          '<div class="glow"></div><div class="rays"></div>' +
          '<div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div>' +
          '<div class="emblem"><svg viewBox="0 0 24 24" aria-hidden="true">' + V.glyph(ev.type) + "</svg></div>" +
          '<div class="confetti"></div>' +
        "</div>";
    }

    el.innerHTML =
      graphic +
      '<div class="text">' +
        '<div class="label"><span class="vx-icon">' + V.icon(ev.platform) + "</span>" +
          "<span>" + V.escapeHtml(V.t("label." + ev.type)) + "</span>" +
          (extra ? '<span class="extra">· ' + V.escapeHtml(extra) + "</span>" : "") +
        "</div>" +
        '<div class="title">' + renderTitle(ev, tpl) + "</div>" +
        (showMessage ? '<div class="message">' + V.escapeHtml(ev.message) + "</div>" : "") +
      "</div>";

    if (v.mediaScale > 0) el.style.setProperty("--media-scale", String(v.mediaScale));
    var title = el.querySelector(".title");
    if (v.fontFamily) title.style.fontFamily = '"' + String(v.fontFamily).replace(/"/g, "") + '", var(--vx-font-display)';
    if (v.fontSize > 0 && v.fontSize !== 100) title.style.fontSize = "calc(var(--u) * " + (3 * v.fontSize / 100).toFixed(3) + ")";
    if (v.textColor) title.style.color = v.textColor;

    var c = el.querySelector(".confetti");
    if (c) confetti(c);
    return el;
  }

  // ---------------------------------------------------------------
  // Queue
  // ---------------------------------------------------------------
  var queue = [];
  var current = null; // { el, end }
  var seen = [];

  function pump() {
    if (current || !queue.length) return;
    var s = V.settings("alertBox");
    if (!s.enabled) { queue.length = 0; return; }
    show(queue.shift(), s);
  }

  /** A user-made design (alert designer): its canvas, scaled to the browser source. */
  function showDesign(ev, s, design) {
    var a = window.VexcastAlertRender.render(design, ev, { mode: "play", audio: V.audioEnabled, mediaUrl: mediaUrl });
    var box = document.createElement("div");
    box.style.cssText = "position:fixed;left:50%;top:50%;transform-origin:0 0";
    var scale = Math.min(window.innerWidth / a.width, window.innerHeight / a.height);
    box.style.transform = "scale(" + scale + ") translate(-50%, -50%)";
    box.appendChild(a.el);
    stage.appendChild(box);
    var duration = Math.max(1000, Number(design.durationMs) || 8000);
    var ended = false;
    var cur = { el: box, end: end };
    current = cur;
    // TTS (when the widget plays audio itself); the design's sound is played by the core.
    var speakDone = V.audioEnabled ? enqueueAudio(function () {
      if (ev.ttsUrl) return playUrl(V.url(ev.ttsUrl), 1, 60000);
      return Promise.resolve();
    }) : Promise.resolve();
    var minDone = false;
    var audioDone = false;
    var maxTimer = setTimeout(end, duration + 30000);
    var minTimer = setTimeout(function () { minDone = true; if (audioDone) end(); }, duration);
    speakDone.then(function () { audioDone = true; if (minDone) end(); });
    function end() {
      if (ended) return;
      ended = true;
      clearTimeout(maxTimer);
      clearTimeout(minTimer);
      a.stop(function () {
        if (box.parentNode) box.parentNode.removeChild(box);
        if (current === cur) current = null;
        setTimeout(pump, 350);
      });
    }
  }

  function show(ev, s) {
    var design = ev.design && (s.designs || []).filter(function (d) { return d.id === ev.design; })[0];
    if (design && window.VexcastAlertRender) return showDesign(ev, s, design);
    var v = variationFor(ev, s);
    applyAccent(v.highlightColor || s.accentColor);
    var el = buildAlert(ev, s);
    stage.appendChild(el);

    var duration = Math.max(2500, Number(v.durationMs) || Number(s.durationMs) || 7000);
    var minDone = false;
    var audioDone = false;
    var ended = false;

    var cur = { el: el, end: end };
    current = cur;

    var maxTimer = setTimeout(end, duration + 30000); // never get stuck on long TTS
    var minTimer = setTimeout(function () { minDone = true; if (audioDone) end(); }, duration);
    alertAudio(ev, s).then(function () { audioDone = true; if (minDone) setTimeout(end, 400); });

    function end() {
      if (ended) return;
      ended = true;
      clearTimeout(maxTimer);
      clearTimeout(minTimer);
      el.classList.add("leaving");
      setTimeout(function () {
        if (el.parentNode) el.parentNode.removeChild(el);
        if (current === cur) current = null;
        setTimeout(pump, 350);
      }, 720);
    }
  }

  function skip() {
    stopAudio();
    if (current) current.end();
  }

  // ?design=<id>: this source shows only that alert (its own browser source).
  // Without it (the general alert box), alerts that have their own source are skipped.
  var onlyDesign = new URLSearchParams(location.search).get("design");
  // ?group=<id>: this source shows the alerts of that group (several alerts in one source).
  var onlyGroup = new URLSearchParams(location.search).get("group");

  V.on("alert", function (ev) {
    if (!ev || !ev.type) return;
    var s = V.settings("alertBox");
    if (!s.enabled) return;
    var design = ev.design && (s.designs || []).filter(function (d) { return d.id === ev.design; })[0];
    if (onlyGroup) {
      var group = (s.groups || []).filter(function (g) { return g.id === onlyGroup; })[0];
      if (!group || !ev.design || (group.designs || []).indexOf(ev.design) < 0) return;
    } else if (onlyDesign) {
      if (ev.design !== onlyDesign) return;
    } else if (design && design.ownSource) {
      return;
    }
    if (ev.id) {
      if (seen.indexOf(ev.id) >= 0) return;
      seen.push(ev.id);
      if (seen.length > 100) seen.shift();
    }
    queue.push(ev);
    pump();
  });

  // Forward-compatible skip events (REST /alerts/skip); unknown types are ignored.
  V.on("alert_skip", skip);
  V.on("alerts_skip", skip);

  V.on("state", function () {
    var s = V.settings("alertBox");
    applyAccent(s.accentColor);
    if (!s.enabled) {
      queue.length = 0;
      skip();
    }
  });

  applyAccent(V.settings("alertBox").accentColor);
})();
</script>
</body>
</html>
