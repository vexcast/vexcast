name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-windows:
    name: Core + libobs engine (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: OBS runtime
        run: node scripts/fetch-obs-runtime.mjs target/debug target/debug/deps
      - name: Test core
        run: cargo test -p vexcast-core
      - name: Build server and desktop shell
        run: cargo build -p vexcast-server

  linux-obs:
    name: App + libobs engine (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: OBS Studio from the official PPA (libobs + headers), Tauri/WebKitGTK
        run: |
          sudo add-apt-repository -y ppa:obsproject/obs-studio
          sudo apt-get update
          sudo apt-get install -y obs-studio libclang-dev pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf file xvfb libgl1-mesa-dri
          pkg-config --modversion libobs
      - run: pnpm install --frozen-lockfile
      - name: Build core and server with the engine
        run: cargo build -p vexcast-core -p vexcast-server
      - name: Build the .deb and the AppImage
        working-directory: apps/desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: pnpm tauri build --bundles deb,appimage --config src-tauri/tauri.no-updater.conf.json
      - name: Bundle OBS in the AppImage
        run: |
          mkdir -p dist-linux
          cp target/release/bundle/deb/*.deb dist-linux/
          scripts/package-appimage.sh target/release/bundle/appimage/*.AppImage dist-linux/Vexcast_ci_amd64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: vexcast-linux-amd64
          path: dist-linux/*
          retention-days: 7
      - name: Smoke test the AppImage without OBS installed on the system
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          sudo apt-get remove -y obs-studio
          ! pkg-config --exists libobs || { echo "::error::OBS is still installed"; exit 1; }
          xvfb-run -a -s "-screen 0 1920x1080x24" dist-linux/Vexcast_ci_amd64.AppImage > app.log 2>&1 &
          ready=""
          for i in $(seq 1 150); do
            ready=$(curl -sf http://127.0.0.1:7420/api/v1/state | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const st=JSON.parse(s).status||{};if(st.ready)console.log(st.obsVersion)}catch{}})" || true)
            [ -n "$ready" ] && break; sleep 1
          done
          types=$(curl -sf http://127.0.0.1:7420/api/v1/obs/source-types | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).map(t=>t.id).join(' '))}catch{}})" || true)
          curl -sf http://127.0.0.1:7420/api/v1/obs/plugins || true
          pkill -f Vexcast_ci_amd64 || true
          grep -E "error|ERROR|warning|libobs|plugin|browser" app.log | head -n 80 || true
          [ -n "$ready" ] || { echo "::error::The engine did not start inside the AppImage"; tail -n 60 app.log; exit 1; }
          echo "Engine ready inside the AppImage, OBS $ready"
          echo "Source types: $types"
          case " $types " in *" browser_source "*) echo "Browser source available";; *) echo "::warning::browser_source is not available inside the AppImage";; esac

  macos-obs:
    name: App + libobs engine (macOS ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, arch: aarch64, obs: apple }
          - { runner: macos-15-intel, arch: x86_64, obs: intel }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    env:
      LIBOBS_PATH: ${{ github.workspace }}/obs-runtime-macos
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      VEXCAST_OBS_ARCH: ${{ matrix.obs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: brew install simde
      - name: OBS runtime
        run: node scripts/fetch-obs-runtime.mjs obs-runtime-macos target/release
      - name: Build the server
        run: pnpm --filter @vexcast/desktop build && cargo build --release -p vexcast-server
      - name: Smoke test (headless server with the engine)
        run: |
          ./target/release/vexcast-server --port 7499 --data-dir "$RUNNER_TEMP/vexcast" --ui-dir apps/desktop/dist > server.log 2>&1 &
          # The engine loads its plugins after the API is up: wait for status.ready.
          ready=""
          for i in $(seq 1 90); do
            ready=$(curl -sf http://127.0.0.1:7499/api/v1/state | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const st=JSON.parse(s).status||{};if(st.ready)console.log(st.obsVersion)}catch{}})" || true)
            [ -n "$ready" ] && break; sleep 1
          done
          [ -n "$ready" ] || { echo "::error::The libobs engine did not start"; exit 1; }
          echo "Engine ready, OBS $ready"
          curl -sf http://127.0.0.1:7499/api/v1/obs/source-types | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log('Source types:',JSON.parse(s).map(t=>t.id).join(', ')))"
          kill %1 || true
      - name: Server log (errors and warnings)
        if: always()
        run: grep -E "error|ERROR|warning|WARN|reset_video|libobs|Motor" server.log | head -n 120 || true
      - name: Build Vexcast.app and DMG
        run: |
          (cd apps/desktop && pnpm tauri build --bundles app --config src-tauri/tauri.no-updater.conf.json)
          node scripts/package-macos.mjs --app target/release/bundle/macos/Vexcast.app --runtime obs-runtime-macos --out dist-macos --version ci --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: vexcast-macos-${{ matrix.arch }}
          path: dist-macos/*.dmg
          retention-days: 7
      - name: Smoke test the packaged app (engine and browser source inside Vexcast.app)
        run: |
          app=target/release/bundle/macos/Vexcast.app
          exe="$app/Contents/MacOS/$(ls "$app/Contents/MacOS" | head -n1)"
          "$exe" > app.log 2>&1 &
          ready=""
          for i in $(seq 1 120); do
            ready=$(curl -sf http://127.0.0.1:7420/api/v1/state | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const st=JSON.parse(s).status||{};if(st.ready)console.log(st.obsVersion)}catch{}})" || true)
            [ -n "$ready" ] && break; sleep 1
          done
          types=$(curl -sf http://127.0.0.1:7420/api/v1/obs/source-types | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).map(t=>t.id).join(' '))}catch{}})" || true)
          kill %1 || true
          grep -E "error|ERROR|browser|CEF" app.log | head -n 60 || true
          [ -n "$ready" ] || { echo "::error::The engine did not start inside Vexcast.app"; exit 1; }
          echo "Engine ready inside Vexcast.app, OBS $ready"
          echo "Source types: $types"
          case " $types " in *" browser_source "*) echo "Browser source available";; *) echo "::warning::browser_source is not available inside Vexcast.app";; esac

  core-portable:
    name: Core without engine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ startsWith(matrix.os, 'macos') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test core (no libobs)
        run: cargo test -p vexcast-core --no-default-features

  frontend:
    name: Desktop UI & mobile app
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck & build desktop UI
        run: pnpm --filter @vexcast/desktop build
      - name: Typecheck mobile app
        run: pnpm --filter @vexcast/mobile typecheck
